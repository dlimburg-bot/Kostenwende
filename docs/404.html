<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden – Kostenwende</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/Kostenwende/icon-192.png">
<style>
:root{--bg:#F5F6F0;--fg:#14211A;--muted:#55624F;--accent:#3F6B12;--on:#fff;--card:#fff;--line:#DDE3D5}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A13;--fg:#EEF3EA;--muted:#A9B5A3;--accent:#9BC53D;--on:#0F1A13;--card:#16241B;--line:#24382B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
main{max-width:460px;text-align:center}
.brand{font-weight:800;font-size:22px;margin-bottom:32px}.brand span{color:var(--accent)}
.code{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin:0}
h1{font-size:24px;margin:12px 0 8px;text-wrap:balance}
p{color:var(--muted);margin:0 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-block;padding:14px 22px;border-radius:999px;font-weight:700;text-decoration:none;min-height:48px}
.primary{background:var(--accent);color:var(--on)}
.ghost{border:2px solid var(--line);color:var(--fg);background:var(--card)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="brand">Kosten<span>wende</span></div>
  <p class="code">404</p>
  <h1>Diese Seite gibt es nicht (mehr).</h1>
  <p>Kein Problem: Ihre Ersparnis berechnen Sie direkt auf der Startseite, in 30 Sekunden.</p>
  <div class="btns">
    <a class="btn primary" href="/Kostenwende/#sparen">Ersparnis berechnen</a>
    <a class="btn ghost" href="/Kostenwende/#partner">Partner werden</a>
  </div>
</main>
</body>
</html>
